apiVersion: v1
kind: Secret
metadata:
  name: openai-secrets
  namespace: default
type: Opaque
stringData:
  api-key: "sk-REPLACE_ME"
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: codex
  namespace: default
spec:
  description: "OpenAI Codex agent via CLI-A2A-Adapter"
  type: byo
  byo:
    deployment:
      image: ghcr.io/0xleo258/cli-a2a-adapter:latest
      env:
        - name: ADAPTER_BACKEND
          value: "codex"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secrets
              key: api-key
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "4000m"
